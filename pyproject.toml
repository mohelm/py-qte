[build-system]
requires = ["meson-python", "ninja", "numpy>=2.5.1", "packaging"]
build-backend = "mesonpy"

[project]
name = "py-qte"
version = "0.1.0a1"
description = "Quantile Treatment Effects"
authors = [{ name = "Moritz Helm", email = "mohelm84@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
  "quantile treatment effects",
  "causal inference",
  "econometrics",
  "quantile regression",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "altair>=6.2.2",
  "formulaic>=1.2.2",
  "great-tables>=0.23.0",
  "numpy>=2.5.1",
  "polars>=1.43.2",
  "pyarrow>=25.0.0",
  "rich>=15.0.0",
  "scipy>=1.18.0",
  "statsmodels>=0.14.6",
]

[project.urls]
Homepage = "https://github.com/mohelm/py-qte"
Repository = "https://github.com/mohelm/py-qte"
Issues = "https://github.com/mohelm/py-qte/issues"

[dependency-groups]
dev = [
  "cibuildwheel>=4.0.0",
  "meson-python>=0.20.0",
  "ninja>=1.13.0",
  "pillow>=12.3.0",
  "pytest-sugar>=1.1.1",
  "pytest>=9.1.1",
  "ruff>=0.16.1",
  "ty>=0.0.66",
  "vl-convert-python>=1.7.0",
]
dev-helpers = ["ipython>=9.16.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["ANN", "D"]
"src/**.py" = ["D100", "D101", "D102", "D103", "D104"]

[tool.uv]
no-build-isolation = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests", "src/qte/changes_in_changes"]

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*"]
test-requires = ["pytest"]
test-command = "python -c \"import qte, qte.stats; from qte.quantile_regression import rq_fortran; print('wheel ok')\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y --enablerepo=powertools gcc-gfortran lapack-devel"

[tool.cibuildwheel.macos]
# Homebrew GCC provides `gfortran-<version>`; the runner images remove the
# unversioned symlink. OpenBLAS is keg-only, hence the explicit pkg-config path
# for both Intel (/usr/local) and Apple Silicon (/opt/homebrew) prefixes.
before-all = "brew install openblas"
environment = { FC = "gfortran-15", PKG_CONFIG_PATH = "/usr/local/opt/openblas/lib/pkgconfig:/opt/homebrew/opt/openblas/lib/pkgconfig" }
