# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = '^docs/reference/' },
  { id = "end-of-file-fixer", exclude = '^docs/reference/' },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.7"
hooks = [
  { id = "ruff-check" },
  { id = "ruff-format", files = '\.(py|pyi|ipynb|qmd)$', exclude = '^docs/reference/' },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.80"
hooks = [{ id = "ty" }]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"
hooks = [{ id = "taplo-format" }]

# R formatting for docs via styler. A local, lightweight R environment
# (styler + knitr only) avoids the heavy lorenzwalthert/precommit metapackage,
# whose deps (xml2, V8, curl, fs) need system libraries that aren't installed.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "style-files"
name = "style-files (styler)"
language = "r"
entry = "Rscript -e 'styler::style_file(commandArgs(TRUE))'"
files = '^docs/.*\.(qmd|Rmd|R|r)$'
exclude = '^docs/reference/'
additional_dependencies = ["styler", "knitr"]
