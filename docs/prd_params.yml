# Production parameters for the published benchmark (large, slow).
n_iter: 100          # bootstrap iterations for the Lalonde AIPW comparison
n_iter_simple: 1000  # bootstrap iterations for the unconfoundedness comparison
n_workers: 8         # parallel workers
seed: 42             # shared RNG seed
n_sim_unconfounded: 100000  # unconfounded simulated sample size
n_sim_confounded: 100000    # confounded simulated sample size
n_iter_sim: 20       # bootstrap iterations for the simulated-data comparison
n_sim_py_qte_only: 1000000  # extra py-qte-only run; 0 disables it (scaled x1000)
