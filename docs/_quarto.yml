project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "cross_sectional/*.qmd"
    - "did/*.qmd"
    - "iv/*.qmd"
    - "rdd/*.qmd"
    - "reference/*.qmd"

# The API sidebar is generated by `quartodoc build` into this file and merged
# into the project config by Quarto.
metadata-files:
  - _quartodoc-sidebar.yml

website:
  title: "py-qte"
  repo-url: https://github.com/mohelm/py-qte
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "Cross-Sectional"
        menu:
          - text: "Estimators"
            href: cross_sectional/index.qmd
          - text: "Benchmarks"
            href: cross_sectional/benchmarks.qmd
      - text: "IV"
        menu:
          - text: "Estimators"
            href: iv/index.qmd
          - text: "Instrument Validity"
            href: iv/validity.qmd
      - text: "Regression Discontinuity"
        menu:
          - text: "Estimators"
            href: rdd/index.qmd
      - text: "Difference-in-Differences"
        menu:
          - text: "Estimators"
            href: did/index.qmd
          - text: "Aggregating Estimates"
            href: did/aggregation.qmd
      - text: "Reference"
        href: reference/index.qmd

format:
  html:
    embed-resources: true
    code-fold: true
    code-summary: "Show code"
    filters:
      - interlinks.lua

# Cross-document links produced by the interlinks filter. It resolves
# `[](`qte.module.object`)` and, with autolink enabled, inline `` `Object` ``
# code against the local `objects.json` (plus any external inventories).
interlinks:
  autolink: true
  # Register the public objects under their short names so docstrings can use
  # e.g. `` `CausalTarget` `` instead of the fully qualified path. An empty
  # alias strips the package prefix. The value must be a one-element list:
  # Quarto coerces a bare empty string to `[]`, which would register nothing.
  aliases:
    qte.cross_sectional:
      - ""
    qte.iv:
      - ""
    qte.rdd:
      - ""
    qte.rdd.simulate:
      - ""
    qte.distributional_did:
      - ""
    qte.quantile_regression:
      - ""
    qte.datasets:
      - ""
    qte.bootstrap:
      - ""

# API reference, generated from docstrings with `quartodoc build`.
quartodoc:
  package: qte
  dir: reference
  source_dir: ../src
  parser: numpy
  sidebar:
    title: "API Reference"
    style: docked
    collapse-level: 2
  renderer:
    style: renderer.py
    show_signature_annotations: true
    display_name: name
    render_interlinks: true
  sections:
    - title: Cross-Sectional Estimators
      desc: Quantile treatment effect estimators for cross-sectional data (`qte.cross_sectional`).
      package: qte.cross_sectional
      contents:
        - estimate_unadjusted_effects
        - estimate_ipw_effects
        - estimate_outcome_regression_effects
        - estimate_aipw_effects
        - name: QteResult
          include_inherited: true
        - CausalTarget
        - Estimator
        - OutcomeRegressionConfig
    - title: Simulation
      desc: Simulation functions for the cross-sectional estimators (`qte.cross_sectional.simulate`).
      package: qte.cross_sectional.simulate
      contents:
        - simulate_simple_data
        - simulate_covariate_data
        - get_true_quantiles
        - get_true_means
    - title: Instrumental Variables
      desc: Local quantile treatment effects for compliers (`qte.iv`).
      package: qte.iv
      contents:
        - estimate_unconditional_local_effects
        - name: UnconditionalLocalQteResult
          include_inherited: true
        - estimate_conditional_local_effects
        - name: ConditionalLocalQteResult
          include_inherited: true
        - estimate_ivqr_effects
        - IvqrTreatment
        - name: IvqrResult
          include_inherited: true
        - InstrumentProbabilityResult
        - perform_instrument_validity_test
        - name: InstrumentValidityResult
          include_inherited: true
        - ValidityWeighting
        - Estimator
        - WeightAdjustment
    - title: IV Simulation
      desc: Simulation functions for the instrumental-variables estimator (`qte.iv.simulate`).
      package: qte.iv.simulate
      contents:
        - simulate_data
        - get_true_local_effects
    - title: Regression Discontinuity
      desc: Local quantile treatment effects for compliers in regression-discontinuity designs (`qte.rdd`).
      package: qte.rdd
      contents:
        - estimate_rdd_distribution_effects
        - name: RddDistributionResult
          include_inherited: true
        - RunningVariableConfig
        - LocalPolynomialConfig
        - RddInference
        - Kernel
        - plot_rdd_design
        - plot_rdd_treatment
    - title: RDD Simulation
      desc: Simulation functions for the regression-discontinuity estimator (`qte.rdd.simulate`).
      package: qte.rdd.simulate
      contents:
        - simulate_rdd_data
        - get_true_local_effects
        - get_true_first_stage
    - title: Distributional Difference-in-Differences
      desc: Changes-in-changes and quantile difference-in-differences estimators for panel data (`qte.distributional_did`).
      package: qte.distributional_did
      contents:
        - estimate_changes_in_changes_effects
        - estimate_quantile_did_effects
        - estimate_mean_did_effects
        - estimate_distributional_did_effects
        - DistributionalDidResults
        - name: DistributionalDidResult
          include_inherited: true
        - TrtGroupConfig
        - Estimator
        - SamplingScheme
        - ControlGroup
        - BasePeriod
    - title: Data
      desc: Datasets bundled with py-qte (`qte.datasets`).
      package: qte.datasets
      contents:
        - load_lalonde
        - load_mpdta
        - load_engel_with_weights
        - load_card
        - load_jtpa
        - load_pension
        - load_ddk_2011
    - title: Bootstrap
      desc: Shared bootstrap configuration for the estimators (`qte.bootstrap`).
      package: qte.bootstrap
      contents:
        - BootstrapConfig
        - BootstrapMultiplierConfig
    - title: Quantile Regression
      desc: Quantile regression solver and algorithm selection (`qte.quantile_regression`).
      package: qte.quantile_regression
      contents:
        - QuantileRegressionAlgorithms
