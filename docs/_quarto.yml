project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "reference/*.qmd"

# The API sidebar is generated by `quartodoc build` into this file and merged
# into the project config by Quarto.
metadata-files:
  - _quartodoc-sidebar.yml

website:
  title: "py-qte"
  navbar:
    left:
      - text: "Benchmark"
        href: benchmark.qmd
      - text: "Reference"
        href: reference/index.qmd

format:
  html:
    embed-resources: true
    code-fold: true
    code-summary: "Show code"
    filters:
      - interlinks.lua

# Cross-document links produced by the interlinks filter. It resolves
# `[](`qte.module.object`)` and, with autolink enabled, inline `` `Object` ``
# code against the local `objects.json` (plus any external inventories).
interlinks:
  autolink: true
  # Register the public objects under their short names so docstrings can use
  # e.g. `` `CausalTarget` `` instead of the fully qualified path. An empty
  # alias strips the package prefix. The value must be a one-element list:
  # Quarto coerces a bare empty string to `[]`, which would register nothing.
  aliases:
    qte.cross_sectional:
      - ""
    qte.nonlinear_did:
      - ""
    qte.quantile_regression:
      - ""
    qte.datasets:
      - ""
    qte.bootstrap:
      - ""

# API reference, generated from docstrings with `quartodoc build`.
quartodoc:
  package: qte
  dir: reference
  source_dir: ../src
  parser: numpy
  sidebar:
    title: "API Reference"
    style: docked
    collapse-level: 2
  renderer:
    style: renderer.py
    show_signature_annotations: true
    display_name: name
    render_interlinks: true
  sections:
    - title: Cross-Sectional Estimators
      desc: Quantile treatment effect estimators for cross-sectional data (`qte.cross_sectional`).
      package: qte.cross_sectional
      contents:
        - estimate_unadjusted_effects
        - estimate_ipw_effects
        - estimate_outcome_regression_effects
        - estimate_aipw_effects
        - name: QteResult
          include_inherited: true
        - CausalTarget
        - Estimator
    - title: Simulation
      desc: Simulation functions for the cross-sectional estimators (`qte.cross_sectional.simulate`).
      package: qte.cross_sectional.simulate
      contents:
        - simulate_simple_data
        - simulate_covariate_data
        - get_true_quantiles
        - get_true_means
    - title: Nonlinear Difference-in-Differences
      desc: Changes-in-changes and quantile difference-in-differences estimators for panel data (`qte.nonlinear_did`).
      package: qte.nonlinear_did
      contents:
        - estimate_nonlinear_did_for_panel
        - NonlinearDidResults
        - name: NonlinearDidResult
          include_inherited: true
        - TrtGroupConfig
        - CounterfactualModel
        - ControlGroup
        - BasePeriod
    - title: Data
      desc: Datasets bundled with py-qte (`qte.datasets`).
      package: qte.datasets
      contents:
        - load_lalonde
        - load_mpdta
        - load_engel_with_weights
    - title: Bootstrap
      desc: Shared bootstrap configuration for the estimators (`qte.bootstrap`).
      package: qte.bootstrap
      contents:
        - BootstrapConfig
